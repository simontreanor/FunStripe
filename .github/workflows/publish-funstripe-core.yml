name: Publish FunStripe.Core to NuGet

on:
  push:
    tags:
      - 'v[0-9]+/*'   # v<major>/X.Y.Z, e.g. v3/3.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'New FunStripe.Core version number (overrides tag)'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write   # NuGet Trusted Publishing: exchange the GitHub OIDC token for a short-lived API key

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_FILE: src/FunStripe.Core/FunStripe.Core.fsproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_REF_NAME#*/}"
            # The tag prefix names the major version; refuse a mismatch such as v2/3.0.0
            if [ "${GITHUB_REF_NAME%%/*}" != "v${version%%.*}" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match major version of $version"
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build ${{ env.PROJECT_FILE }} -c Release

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_FILE }} -c Release -p:Version=${{ steps.version.outputs.value }}

      # Trusted Publishing (no stored API key): needs a policy on nuget.org for this repository
      # and workflow file. The key it returns lasts an hour, so log in just before pushing.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: simontreanor   # nuget.org profile name of the package owner

      - name: Publish NuGet package
        run: dotnet nuget push src/FunStripe.Core/bin/Release/FunStripe.Core.${{ steps.version.outputs.value }}.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
