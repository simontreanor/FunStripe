name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Generated code matches the generator
        # Regenerates src/ from the spec and versions in Directory.Build.props and fails
        # if the committed generated files differ: a hand edit, a generator or SpecPatches
        # change committed without regenerating, or a version bump without regenerating.
        # It also catches generator crashes on every PR, not only in the weekly spec job.
        # Output goes to an empty dir, so an extra file in a generated folder fails too.
        run: |
          out="${RUNNER_TEMP}/generated"
          dotnet run --project tools/FunStripe.Generator -- --output "$out"
          drift=0
          for path in Stripe StripeRequest StripeIds.fs; do
            diff -r "$out/$path" "src/$path" > "${RUNNER_TEMP}/drift-$path.txt" || drift=1
          done
          if [ "$drift" = 1 ]; then
            cat "${RUNNER_TEMP}"/drift-*.txt | head -n 200
            echo "::error::Generated files in src/ do not match the generator's output. Never hand-edit them: change tools/FunStripe.Generator (SpecPatches.fs for spec gaps) and run: dotnet run --project tools/FunStripe.Generator -- --output src"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
